<div class="shell" [class.sidebar-reduite]="sidebarReduite()">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="heart">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-9.5-9C.7 8.4 2.4 5 6 5c2 0 3.4 1 4.5 2.4C11.6 6 13 5 15 5c3.6 0 5.3 3.4 3.5 7-2.5 4.6-9.5 9-9.5 9z" fill="#1FAAB4" /></svg>
        </div>
        <span>TerangaHealth</span>
      </div>
      <button class="toggle-sidebar" (click)="toggleSidebar()" aria-label="Plier/déplier le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/bienvenue" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10" /></svg>
        <span class="label">Accueil</span>
      </a>
      <a routerLink="/services" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v6a4 4 0 008 0V3" /><path d="M8 3H6M16 3h2" /><path d="M12 13v3" /><circle cx="12" cy="18" r="3" /></svg>
        <span class="label">Lister les services</span>
      </a>
      <a routerLink="/prendre-rdv" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18M9 16l2 2 4-4" /></svg>
        <span class="label">Prendre RDV</span>
      </a>
      <a routerLink="/mes-rendez-vous" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
        <span class="label">Lister mes rendez-vous</span>
      </a>
      <a routerLink="/mes-paiements" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2" /><path d="M2 10h20" /></svg>
        <span class="label">Mes paiements</span>
      </a>
      <a routerLink="/profil" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></svg>
        <span class="label">Mon profil</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        <span class="label">Déconnexion</span>
      </button>
    </div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-right">
        <a routerLink="/rappels" class="icon-btn" aria-label="Mes rappels">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" /></svg>
        </a>
        <a routerLink="/messages" class="icon-btn" aria-label="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>
          @if (nombreMessagesNonLus() > 0) {
            <span class="badge badge-green">{{ nombreMessagesNonLus() }}</span>
          }
        </a>
        <div class="user-menu">
          <button class="user-trigger" (click)="toggleMenu()">
            <div class="avatar-sm">{{ initiales() }}</div>
            <div class="user-info-sm">
              <strong>{{ nomComplet() }}</strong>
              <span class="online-dot">● En ligne</span>
            </div>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          @if (menuOuvert()) {
            <div class="dropdown">
              <a routerLink="/profil" (click)="toggleMenu()">Mon profil</a>
              <button (click)="logout()">Déconnexion</button>
            </div>
          }
        </div>
      </div>
    </header>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-chatbot></app-chatbot>
  <app-assistant-vocal-flottant></app-assistant-vocal-flottant>
</div>
