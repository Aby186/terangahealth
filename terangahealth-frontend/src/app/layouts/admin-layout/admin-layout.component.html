<div class="shell" [class.sidebar-reduite]="sidebarReduite()">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="heart">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.4-9.5-9C.7 8.4 2.4 5 6 5c2 0 3.4 1 4.5 2.4C11.6 6 13 5 15 5c3.6 0 5.3 3.4 3.5 7-2.5 4.6-9.5 9-9.5 9z" fill="#1FAAB4" /></svg>
        </div>
        <span>TerangaHealth</span>
      </div>
      <button class="toggle-sidebar" (click)="toggleSidebar()" aria-label="Plier/déplier le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/accueil" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10" /></svg>
        <span class="label">Accueil</span>
      </a>
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
        <span class="label">Dashboard</span>
      </a>
      <a routerLink="/admin/utilisateurs" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3" /><circle cx="16.5" cy="9" r="2.3" /><path d="M2.5 20c0-3.3 2.7-6 6-6h1c1 0 2 .2 2.8.7" /><path d="M14.5 20c.3-2.8 2.1-5 4.8-5 1.9 0 3.4.9 4.2 2.4" /></svg>
        <span class="label">Gestion Utilisateurs</span>
      </a>
      <a routerLink="/admin/services" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.9 6.3L22 9l-5 5 1.3 7.2L12 17.8 5.7 21.2 7 14 2 9l7.1-.7z" /></svg>
        <span class="label">Gestion Services</span>
      </a>
      <a routerLink="/admin/rapport" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 20V10M12 20V4M6 20v-6" /></svg>
        <span class="label">Rapport</span>
      </a>
      <a routerLink="/admin/profil" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        <span class="label">Profil</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        <span class="label">Déconnexion</span>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-right">
        <a routerLink="/admin/notifications" class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" /></svg>
          @if (nombreNotifications() > 0) {
            <span class="badge badge-red">{{ nombreNotifications() }}</span>
          }
        </a>
        <a routerLink="/admin/messages" class="icon-btn" aria-label="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>
          @if (nombreMessagesNonLus() > 0) {
            <span class="badge badge-green">{{ nombreMessagesNonLus() }}</span>
          }
        </a>
        <div class="user-menu">
          <button class="user-trigger" (click)="toggleMenu()">
            <div class="avatar-sm">{{ initiales() }}</div>
            <div class="user-info-sm">
              <strong>{{ nomComplet() }}</strong>
              <span class="online-dot">● En ligne</span>
            </div>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
          </button>

          @if (menuOuvert()) {
            <div class="dropdown">
              <button (click)="logout()">Déconnexion</button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
