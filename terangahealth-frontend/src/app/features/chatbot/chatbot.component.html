<div class="chatbot-wrapper">

  @if (ouvert()) {
    <div class="chat-window">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" /></svg>
          </div>
          <div>
            <strong>Assistant TerangaHealth</strong>
          </div>
        </div>
        <button class="btn-close" (click)="toggleOuvert()" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <div class="chat-body">
        @for (m of messages(); track $index) {
          <div class="message" [class.message-patient]="m.auteur === 'patient'" [class.message-bot]="m.auteur === 'bot'">
            <p>{{ m.texte }}</p>

            @if (m.services && m.services.length > 0) {
              <div class="services-suggeres">
                @for (s of m.services; track s.id) {
                  <button class="service-chip" (click)="prendreRdv(s)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
                    Prendre RDV en {{ s.nom }}
                  </button>
                }
              </div>
            }
          </div>
        }

        @if (enCours()) {
          <div class="message message-bot">
            <p class="typing">
              <span></span><span></span><span></span>
            </p>
          </div>
        }
      </div>

      <div class="chat-input-row">
        <input
          type="text"
          [(ngModel)]="saisie"
          (keyup.enter)="envoyer()"
          [disabled]="enCours()"
        />
        <button class="btn-envoyer" (click)="envoyer()" [disabled]="enCours() || !saisie().trim()" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </div>
      <div class="chat-legal-note">Ceci ne remplace pas un avis médical.</div>
    </div>
  }

  <button class="chat-toggle" (click)="toggleOuvert()" aria-label="Ouvrir l'assistant">
    @if (!ouvert()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" /></svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg>
    }
  </button>

</div>
